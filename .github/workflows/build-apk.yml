      - name: Build Debug APK - Fermata
        run: ./gradlew fermata:assembleDebug

      - name: Build Debug APK - Control
        run: ./gradlew control:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            fermata/build/outputs/apk/**/debug/*.apk
            control/build/outputs/apk/**/debug/*.apk
          if-no-files-found: ignore
