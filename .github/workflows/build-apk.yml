name: Build Kun Utube APK

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Grant execute permission
        run: chmod +x gradlew

      # ✅ THIS is where your step must go
      - name: Create dummy google-services.json
        run: |
          mkdir -p fermata
          cat > fermata/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "dummy-project",
              "storage_bucket": "dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef",
                  "android_client_info": {
                    "package_name": "me.aap.fermata"
                  }
                },
                "api_key": [
                  {
                    "current_key": "dummy_key"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
